; SteamSocketsによるインターネット越し接続(docs/online-play-design.md
; 「SteamSocketsによるインターネット越し接続」参照)。テスト用AppID 480
; (Valve提供のSpacewar、Steamworksパートナー登録不要)を使う。友達同士で
