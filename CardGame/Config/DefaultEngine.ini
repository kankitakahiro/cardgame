[OnlineSubsystem]
DefaultPlatformService=Steam

[OnlineSubsystemSteam]
bEnabled=true
SteamDevAppId=480
; 直接exeを起動しても毎回Steam経由での再起動を求められないようにする
; (友達に「exeをダブルクリックするだけ」で遊んでもらうため。Steamクライアント
; 自体は起動している必要がある)。
bRelaunchInSteam=false

; GameNetDriverをSteamSocketsに差し替える。Steamが使えない環境(未起動等)では
; DriverClassNameFallbackにより自動でこれまで通りのIpNetDriver(LAN直接IP接続)
; にフォールバックするため、既存のLAN対戦は無条件で動き続ける。
