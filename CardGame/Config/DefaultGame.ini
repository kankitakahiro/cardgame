[ConsoleVariables]
CommonUI.CheckKeyboardFocusAndParentage=1
CommonUI.DisallowUserFocusedWidgetForPendingFocusRecipient=1
CommonUI.FallbackToDesiredOnAutoRestoreFailure=1

; T_BattlefieldBackground等、C++からLoadObject(ハードコードされたパス文字列)
; でしか参照されないアセットは、通常のアセット参照グラフから見えないため
; パッケージ化時のクッキング対象から漏れてしまう(パッケージ配布後に背景画像が
; 表示されずフォールバックの単色になる不具合として発覚)。/Game/CardGame以下を
; 常にクックする対象に指定することで、今後同種のアセットを追加した場合も
; 同じ問題が起きないようにする。
[/Script/UnrealEd.ProjectPackagingSettings]
+DirectoriesToAlwaysCook=(Path="/Game/CardGame")

; 「オンライン対戦とデッキ構築が押せなくなっている」という不具合報告への対応。
; 原因はパッケージビルドにL_Card_GamePrototype/L_DeckBuilderが含まれておらず、
; UCGLobbyHUD::HandleDeckBuilderClicked()のOpenLevel()や、オンライン対戦の
; ホスト/対戦開始時のOpenLevel(...,listen)が「マップが存在しない」で
; サイレントに失敗していたため(L_Lobbyしかパッケージに含まれていなかった)。
; DirectoriesToAlwaysCookは非マップアセット向けで、マップパッケージ自体を
; 確実にステージングに含めるには、この「含めるマップの一覧」への明示的な
; 登録が必要。以後はRunUAT BuildCookRunに-Mapを毎回指定しなくても、
; この設定だけで全マップがパッケージに含まれる。
+MapsToCook=(FilePath="/Game/CardGame/Maps/L_Lobby")
+MapsToCook=(FilePath="/Game/CardGame/Maps/L_Card_GamePrototype")
+MapsToCook=(FilePath="/Game/CardGame/Maps/L_DeckBuilder")
